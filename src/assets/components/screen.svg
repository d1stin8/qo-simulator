<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 40" width="80" height="40">
  <!-- Screen body: a tall narrow rectangle representing the screen surface -->
  <rect x="34" y="2" width="12" height="36" rx="2" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <!-- Fringe lines to suggest interference pattern -->
  <line x1="37" y1="6"  x2="37" y2="34" stroke="#a5b4fc" stroke-width="1.5" opacity="0.9"/>
  <line x1="40" y1="6"  x2="40" y2="34" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
  <line x1="43" y1="6"  x2="43" y2="34" stroke="#a5b4fc" stroke-width="1.5" opacity="0.9"/>
  <!-- Stand/mount -->
  <rect x="38" y="36" width="4" height="3" fill="#6366f1" opacity="0.7"/>
</svg>
